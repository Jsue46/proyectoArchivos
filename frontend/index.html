<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXT2 File System Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>EXT2 File System Manager</h1>

        <!-- Área de Entrada de Comandos -->
        <div class="input-section">
            <textarea id="commandInput" placeholder="Ingresa tus comandos aquí..."></textarea>
        </div>

        <!-- Botones de Acción -->
        <div class="buttons">
            <input type="file" id="fileInput" accept=".smia" style="display: none;">
            <button onclick="loadFile()" class="btn">Cargar Archivo</button>
            <button onclick="executeCommand()" class="btn">Ejecutar</button>
            <button onclick="clearAll()" class="btn btn-clear">Limpiar</button>
        </div>

        <!-- Área de Salida de Comandos -->
        <div class="output-section">
            <h2>Salida:</h2>
            <pre id="output"></pre>
            <div id="loading" class="loading" style="display: none;">Procesando...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
